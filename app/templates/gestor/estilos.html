<style>
    .gst-page { max-width:1540px; margin:auto; font-size:13px; }

    .gst-heading { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:24px; }

    .gst-timeline { max-height:520px; overflow-y:auto; overscroll-behavior:contain; padding:22px; scrollbar-gutter:stable; }

    .gst-event h4 { margin:0 0 6px; font-size:13px; }
    .gst-event p { margin:6px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.6; }
